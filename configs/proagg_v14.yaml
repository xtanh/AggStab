data_dir: /home/xy_th/Project_protein_aggregation/data/rocklin

model:
  model_name: proagg_mlp_v14  # Multi-task model
  saprot_path: /home/xy_th/SaProt/SaProt_650M_PDB
  lora:
    enabled: true
    r: 4
    alpha: 8
    dropout: 0.2
    target_modules: ["query", "key", "value"]

train:
  save_dir: results/
  lr: 1e-4
  lora_lr: 5e-5
  weight_decay: 0.3
  batch_size: 32
  num_workers: 4
  patience: 3
  epochs: 30
  gradient_clip_val: 0.5

  monitor_metric: val_spearman_75  # Monitor main task
  use_scheduler: true
  scheduler:
    name: ReduceLROnPlateau
    mode: max
    factor: 0.5
    patience: 3
    min_lr: 1e-7

  # Multi-task settings
  task_weights:
    "50": 0.8    # Less weight for 50 clip
    "75": 1.0    # Main task
    "4": 0.6     # Less weight for 4 clip (noisier)

  # Ranking Loss (only applied to main task 75 during training)
  mse_weight: 1.0
  ranking_weight: 0.5
  ranking_margin: 0.3

hardware:
  accelerator: gpu
  devices: [2]
  precision: 16
