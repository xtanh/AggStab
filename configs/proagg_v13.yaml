data_dir: /home/xy_th/Project_protein_aggregation/data/rocklin

model:
  model_name: proagg_mlp_v13  # 使用新的正则化模型
  saprot_path: /home/xy_th/SaProt/SaProt_650M_PDB
  lora:
    enabled: true
    r: 4
    alpha: 8
    dropout: 0.2
    target_modules: ["query", "key", "value"]

train:
  save_dir: results/
  lr: 1e-4
  lora_lr: 5e-5
  weight_decay: 0.3      # 从0.1提升到0.3，更强L2正则
  batch_size: 32
  num_workers: 4
  patience: 3            # 保持3不变
  epochs: 30
  gradient_clip_val: 0.5 # 从1.0降到0.5，更稳定

  monitor_metric: val_spearman
  use_scheduler: true
  scheduler:
    name: ReduceLROnPlateau
    mode: max
    factor: 0.5
    patience: 3          # 保持3不变
    min_lr: 1e-7

  # Ranking Loss settings
  mse_weight: 1.0
  ranking_weight: 1.0
  ranking_margin: 0.3

hardware:
  accelerator: gpu
  devices: [2]
  precision: 16
