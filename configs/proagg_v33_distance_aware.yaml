data_dir: /home/xy_th/Project_protein_aggregation/data/rocklin

model:
  model_name: proagg_mlp_v33
  saprot_path: /home/xy_th/SaProt/SaProt_650M_PDB

  # Hotspot encoder configuration
  hotspot:
    top_k: 5
    min_window: 3

  # LoRA configuration
  lora:
    enabled: true
    r: 4
    alpha: 8
    dropout: 0.2
    target_modules: ["query", "key", "value"]

train:
  save_dir: results/
  lr: 1e-4
  lora_lr: 5e-5
  weight_decay: 0.3
  batch_size: 32
  num_workers: 4
  patience: 3
  epochs: 30
  gradient_clip_val: 0.5

  monitor_metric: val_spearman
  use_scheduler: true
  scheduler:
    name: ReduceLROnPlateau
    mode: max
    factor: 0.5
    patience: 3
    min_lr: 1e-7

  # Training losses
  mse_weight: 1.0
  ranking_weight: 1.0
  ranking_margin: 0.3
  ranking_pair_weighting: gap
  ranking_gap_scale: 1.0
  ranking_pair_clip: 4.0

  # NEW: Distance-aware ranking loss
  # When > 0, uses distance_aware_ranking_loss instead of standard ranking_loss
  # This penalizes cases where predicted distance is much smaller than target distance
  # (i.e., prevents compression of tail samples in prediction space)
  ranking_distance_weight: 1.0

  # Emphasize tail pairs in distance loss
  ranking_tail_threshold: -1.0

hardware:
  accelerator: gpu
  devices: [0]
  precision: 16
