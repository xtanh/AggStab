data_dir: /home/xy_th/Project_protein_aggregation/data/rocklin

model:
  model_name: proagg_mlp_v33
  saprot_path: /home/xy_th/SaProt/SaProt_650M_PDB

  # Hotspot encoder
  hotspot:
    top_k: 5
    min_window: 3

  # LoRA
  lora:
    enabled: true
    r: 4
    alpha: 8
    dropout: 0.2
    target_modules: ["query", "key", "value"]

train:
  save_dir: results/
  lr: 1e-4
  lora_lr: 5e-5
  weight_decay: 0.3
  batch_size: 32
  num_workers: 4
  patience: 3
  epochs: 30
  gradient_clip_val: 0.5

  monitor_metric: val_spearman
  use_scheduler: true
  scheduler:
    name: ReduceLROnPlateau
    mode: max
    factor: 0.5
    patience: 3
    min_lr: 1e-7

  # No ranking loss - pure MSE only
  # This is used by lightning_model.py (clean version)

hardware:
  accelerator: gpu
  devices: [0]
  precision: 16
