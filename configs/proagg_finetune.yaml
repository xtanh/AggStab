data_dir: /home/xy_th/Project_protein_aggregation/data/rocklin

# Unfreeze last 4 ESM-2 Transformer layers (out of 33)
finetune_last_n_layers: 4

train:
  save_dir: results/
  lr: 1e-4            # head learning rate
  esm_lr: 1e-5        # ESM-2 fine-tune learning rate (10x smaller)
  weight_decay: 0.01
  batch_size: 24
  num_workers: 4
  patience: 15
  epochs: 50

  monitor_metric: val_spearman
  use_scheduler: true
  scheduler:
    name: ReduceLROnPlateau
    mode: max
    factor: 0.5
    patience: 5
    min_lr: 1e-7

hardware:
  accelerator: gpu
  devices: [3]
  precision: 16        # fp16 to save memory for ESM-2 gradients
